      <script>
    document.addEventListener("DOMContentLoaded", function() {
        let currentPage = window.location.pathname.split("/").pop().toLowerCase();
        
        if (currentPage === "" || currentPage === "/") {
            currentPage = "dashboard.html";
        }

        const navLinks = document.querySelectorAll(".sidebar .nav-link");
        
        navLinks.forEach(link => {
            let href = link.getAttribute("href");
            if (href) {
                let linkPage = href.split("/").pop().toLowerCase();
                if (linkPage === currentPage) {
                    link.classList.add("active");
                } else {
                    link.classList.remove("active");
                }
            }
        });
    });
</script>

    <script>
    (() => {
      const token=localStorage.getItem("itaskToken"), grid=document.getElementById("doctorCoursesGrid"); if(!grid)return;
      const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
      if(!token){grid.innerHTML='<div class="col-12"><div class="alert alert-warning">Your session is missing. Please sign in again.</div></div>';return;}
      const controller=new AbortController(), timer=setTimeout(()=>controller.abort(),12000);
      fetch("/api/doctor/courses",{headers:{Authorization:`Bearer ${token}`,Accept:"application/json"},signal:controller.signal})
      .then(async r=>{const d=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem("itaskToken");localStorage.removeItem("itaskUser");location.href="../login.html";throw new Error("Session expired.");}if(!r.ok)throw new Error(d.message||`Could not load courses (${r.status})`);if(!Array.isArray(d.courses))throw new Error("The courses API returned an unexpected response.");return d;})
      .then(d=>{const courses=d.courses;grid.innerHTML=courses.length?courses.map((c,i)=>`<div class="col-xl-6"><div class="stat-card border p-4 h-100"><div class="d-flex justify-content-between"><span class="badge bg-primary-subtle text-primary">COURSE ${i+1}</span><i class="fa-solid fa-book-open text-primary fs-4"></i></div><h5 class="fw-bold mt-3">${esc(c.name)}</h5><p class="text-muted small">${esc(c.description||"No course description available.")}</p><div class="border-top pt-3 d-flex justify-content-between align-items-center"><span class="small text-muted"><i class="fa-solid fa-users me-1"></i>${Number(c.enrolled_students)||0} enrolled students</span><a class="btn btn-outline-primary btn-sm" href="instructor-roster.html?courseId=${encodeURIComponent(c.id)}">View students</a></div></div></div>`).join(""):'<div class="col-12"><div class="alert alert-light border">No courses are assigned to your account yet.</div></div>';})
      .catch(e=>{grid.innerHTML=`<div class="col-12"><div class="alert alert-warning">${esc(e.name==="AbortError"?"The courses request timed out. Check the backend and try again.":e.message)}</div></div>`;})
      .finally(()=>clearTimeout(timer));
    })();
    </script>
