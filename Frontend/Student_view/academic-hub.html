<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../api-config.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Hub - iTask</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../role-workspace-shared.css">
</head>
<body style="background-color: #f8fafc;">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


    <nav class="navbar navbar-expand-lg bg-white border-bottom px-4 py-3 sticky-top shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2 text-decoration-none" href="student-view.html">
                <img src="images/itask logo.webp" alt="Logo" class="logo-img" style="width: 32px; height: 32px; object-fit: contain;">
                <span class="fs-5 fw-bold text-dark">iTask</span>
            </a>

            <div class="collapse navbar-collapse justify-content-center">
                <ul class="navbar-nav gap-4">
                    <li class="nav-item">
                        <a class="nav-link text-muted" href="student-view.html">My learning</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-primary fw-semibold active" href="academic-hub.html">Academic hub</a>
                    </li>
                </ul>
            </div>

            <div class="d-flex align-items-center gap-3">
                <div class="d-flex align-items-center gap-1 text-muted small fw-semibold cursor-pointer">
                    <i class="fa-solid fa-globe"></i> EN
                </div>
                <i class="fa-regular fa-circle-question fs-5 text-muted cursor-pointer"></i>
                <div class="avatar-circle rounded-circle text-white d-flex align-items-center justify-content-center fw-bold bg-secondary" style="width: 32px; height: 32px; font-size: 11px;">ST</div>
                <button type="button" id="studentSignOut" class="btn btn-sm btn-outline-secondary">Sign out</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4 px-4" style="max-width: 1400px;">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <span class="text-success text-uppercase fw-bold" style="font-size: 10px; letter-spacing: 1px;">ACADEMIC HUB</span>
                <h3 class="fw-bold text-dark mb-1">Assignments & quizzes</h3>
                <p class="text-muted small mb-0">Track deadlines, submissions, and grades in one place.</p>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-12">
                <div class="stat-card p-0 overflow-hidden mb-4">


                    <table class="table table-hover align-middle mb-0">
                        <tbody id="studentHubAssignments">
                            <tr><td colspan="5" class="text-center text-muted py-4">Loading assignments…</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

    <script>
    (()=>{const token=localStorage.getItem("itaskToken"),body=document.getElementById("studentHubAssignments");if(!token||!body)return;const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));fetch("/api/student/assignments",{headers:{Authorization:`Bearer ${token}`}}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||"Could not load assignments");return d;}).then(d=>{const items=d.assignments||[];body.innerHTML=items.length?items.map(a=>{const date=new Date(a.deadline),submitted=!!a.submitted_at,overdue=!submitted&&date<Date.now(),state=submitted?"Submitted":overdue?"Overdue":"Pending";return `<tr><td class="ps-4 py-3"><div class="small fw-bold">${esc(date.toLocaleDateString())}</div></td><td><span class="text-muted d-block small">${esc(a.course_name)}</span><span class="fw-bold text-dark small">${esc(a.title)}</span><span class="d-block small ${overdue?'text-danger':'text-muted'}">${state}</span></td><td class="text-center text-muted small">Assignment</td><td class="text-center text-muted small">${a.grade===null?'—':esc(a.grade+'%')}</td><td class="text-end pe-4"><a class="btn btn-primary btn-sm" href="student-view.html#liveStudentAssignments">${submitted?'View':'Open'}</a></td></tr>`}).join(""):'<tr><td colspan="5" class="text-center text-muted py-4">No assignments are available for your enrolled courses.</td></tr>';}).catch(e=>{body.innerHTML=`<tr><td colspan="5" class="text-danger p-4">${esc(e.message)}</td></tr>`;});})();
    </script>
    <script>
    document.getElementById("studentSignOut")?.addEventListener("click",()=>{
      localStorage.removeItem("itaskToken"); localStorage.removeItem("itaskUser");
      window.location.href="../login.html";
    });
    </script>
    <script src="../organization-branding.js"></script>
<script src="../role-workspace-shared.js"></script>
</body>
</html>
